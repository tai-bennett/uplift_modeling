experiment:
  name: test_experiment

data:
  type: parquet
  format: polars
  path: criteo_train_small.parquet
  root: data_primary
  metapath: criteo_metadata.yml
  metaroot: meta

data_test:
  type: parquet
  format: polars
  path: criteo_test_small.parquet
  root: data_primary
  metapath: criteo_metadata.yml
  metaroot: meta

pipelines:
  - name: pipeline type 1
    type: proto
    components:
      splitter:
        name: stratified_k_fold
        parameters:
          num_folds:
            type: choice
            values:
              - 5
      sampler:
        name: undersampler
        parameters:
          ratio:
            type: choice
            values:
              - 0.5
              - 1
          seed:
            type: choice
            values:
              - 42069

trial_config:
  metrics:
    - qini
    - auuc

trials:
  - name: test_drlearner
    model: drlearner
    parameters:
      model_effect: xgb_classifier
      effect_parameters:
        n_estimators:
          type: choice
          values:
            - 100
        max_depth:
          type: choice
          values:
            - 6
        learning_rate:
          type: choice
          values:
            - 0.5
        objective:
          type: choice
          values:
            - binary:logistic
      model_propensity: xgb_classifier
      propensity_parameters:
        n_estimators:
          type: choice
          values:
            - 100
        max_depth:
          type: choice
          values:
            - 6
        learning_rate:
          type: choice
          values:
            - 0.5
        objective:
          type: choice
          values:
            - binary:logistic
      model_final: xgb_regressor
      final_parameters:
        n_estimators:
          type: choice
          values:
            - 100
        max_depth:
          type: choice
          values:
            - 6
        learning_rate:
          type: choice
          values:
            - 0.5
        objective:
          type: choice
          values:
            - reg:squarederror
      parameters:
        cv:
          type: choice
          values:
            - 3
  - name: test_tlearner
    model: tlearner
    parameters:
      model_name: xgb_classifier
      parameters:
        n_estimators:
          type: choice
          values:
            - 100
        max_depth:
          type: choice
          values:
            - 6
        learning_rate:
          type: choice
          values:
            - 1
        objective:
          type: choice
          values:
            - binary:logistic
    
