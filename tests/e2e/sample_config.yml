experiment:
  name: test experiment

data:
  type: parquet
  format: polars
  path: data_train.parquet
  root: data_primary
  metapath: criteo_metadata.yml
  metaroot: meta

pipelines:
  - name: pipeline type 1
    type: proto
    components:
      splitter:
        name: stratified_k_fold
        parameters:
          num_folds:
            type: choice
            values:
              - 5
      sampler:
        name: undersampler
        parameters:
          ratio:
            type: choice
            values:
              - 1.0
              - 0.5
          seed:
            type: choice
            values:
              - 42

trial_config:
  metrics:
    - qini
    - mse

trials:
  - name: test trial 1
    model: tlearner
    parameters:
      model_name: sk_gradient_boosting_regressor
      parameters:
        n_estimators:
          type: choice
          values:
            - 10
        max_depth:
          type: choice
          values:
            - 6
        min_samples_leaf:
          type: choice
          values:
            - 10
