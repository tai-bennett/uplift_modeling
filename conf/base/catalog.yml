# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

criteo_uplift:
  type: kedro_datasets.huggingface.HFDataset
  dataset_name: criteo/criteo-uplift

criteo_metadata:
  type: yaml.YAMLDataset
  filepath: data/00_meta/criteo/criteo-uplift.yml

criteo_snapshot:
  type: polars.LazyPolarsDataset
  file_format: parquet
  filepath: data/01_raw/criteo_snapshot.parquet

criteo_train:
  type: polars.LazyPolarsDataset
  file_format: parquet
  filepath: data/03_primary/criteo_train.parquet

criteo_test:
  type: polars.LazyPolarsDataset
  file_format: parquet
  filepath: data/03_primary/criteo_test.parquet

data_train:
  type: polars.LazyPolarsDataset
  file_format: parquet
  filepath: data/03_primary/data_train.parquet

data_test:
  type: polars.LazyPolarsDataset
  file_format: parquet
  filepath: data/03_primary/data_test.parquet

criteo_schema:
  type: yaml.YAMLDataset
  filepath: data/08_reporting/criteo_schema.yml


metadata:
  type: yaml.YAMLDataset
  filepath: data/00_meta/metadata_current.yml