experiment:
  name: uplift_experiment_2

optuna:
  n_trials: 20

data:
  type: parquet
  format: polars
  path: criteo/criteo-uplift_train.parquet
  root: data_primary
  metapath: criteo/criteo-uplift.yml
  metaroot: meta

data_test:
  type: parquet
  format: polars
  path: criteo/criteo-uplift_test.parquet
  root: data_primary
  metapath: criteo/criteo-uplift.yml
  metaroot: meta

pipeline:
  name: pipeline type 1
  type: proto
  components:
    splitter:
      name: stratified_k_fold
      parameters:
        num_splits:
          name: cv_num_folds
          type: categorical
          choices:
            - 5
    sampler:
      name: undersampler
      parameters:
        ratio:
          name: undersample_ratio
          type: categorical
          choices:
            - 0.5
            - 1.0
        seed:
          name: seed
          type: categorical
          choices:
            - 42069

trial_config:
  metrics:
    - qini
    - auuc

studies:
  - name: test_tlearner
    model: tlearner
    parameters:
      model_name: xgb_classifier
      parameters:
        n_estimators:
          type: int
          name: n_estimators
          low: 90
          high: 120
          step: 10
        max_depth:
          name: max_depth
          type: int
          low: 5
          high: 8
        learning_rate:
          name: learning_rate
          type: categorical
          choices:
            - 1
        objective:
          name: objective
          type: categorical
          choices:
            - binary:logistic
  - name: test_drlearner
    model: drlearner
    parameters:
      model_effect: xgb_classifier
      effect_parameters:
        n_estimators:
          type: int
          name: n_estimators_effect
          low: 100
          high: 200
          step: 10
        max_depth:
          name: max_depth_effect
          type: int
          low: 3
          high: 8
        learning_rate:
          name: learning_rate_effect
          type: categorical
          choices:
            - 1.0
            - 0.5
        objective:
          name: objective_effect
          type: categorical
          choices:
            - binary:logistic
      model_propensity: xgb_classifier
      propensity_parameters:
        n_estimators:
          type: int
          name: n_estimators_prop
          low: 100
          high: 200
          step: 10
        max_depth:
          name: max_depth_prop
          type: int
          low: 3
          high: 8
        learning_rate:
          name: learning_rate_prop
          type: categorical
          choices:
            - 1.0
            - 0.5
        objective:
          name: objective_prop
          type: categorical
          choices:
            - binary:logistic
      model_final: xgb_regressor
      final_parameters:
        n_estimators:
          type: int
          name: n_estimators_final
          low: 100
          high: 200
          step: 10
        max_depth:
          name: max_depth_final
          type: int
          low: 3
          high: 8
        learning_rate:
          name: learning_rate_final
          type: categorical
          choices:
            - 1.0
            - 0.5
        objective:
          name: objective_final
          type: categorical
          choices:
            - reg:squarederror
      parameters:
        cv: 3
